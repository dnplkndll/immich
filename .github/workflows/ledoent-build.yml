name: ledoent build (merged-deploy image)

# Builds the linux/amd64 immich-server image from the merged/deploy branch and pushes it to
# the self-hosted Zot registry at registry.hz.ledoweb.com, which is what the k3s cluster
# pulls from.
#
# IMPORTANT: this file must live on `feat/fork-config`, NOT directly on `merged/deploy`.
# `merged/deploy` is regenerated and force-pushed by every `gitaggregate` run, so anything
# committed straight to it is destroyed by the next aggregation. That is exactly what
# happened between 2026-04-23 and 2026-07-26: this workflow was added to merged/deploy in
# April, wiped by the May aggregation, and the cluster then ran a stale image for two months
# while the GHCR builds kept reporting green. Keep it on fork-config so aggregation
# reproduces it every time.
#
# Tags pushed:
#   :merged-deploy    mutable convenience pointer at the newest build
#   :sha-<commit>     immutable, maps 1:1 to a merged/deploy commit — reference THIS one in
#                     helm/values.yaml so the running build is always identifiable and a
#                     rollback is a one-line revert.

on:
  push:
    branches: [merged/deploy]
  workflow_dispatch:

concurrency:
  group: ledoent-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ZOT_IMAGE: registry.hz.ledoweb.com/dnplkndll/immich-server

jobs:
  build:
    name: Build and push server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Zot registry
        uses: docker/login-action@v3
        with:
          registry: registry.hz.ledoweb.com
          username: robot-ci
          password: ${{ secrets.ZOT_CI_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ZOT_IMAGE }}:merged-deploy
            ${{ env.ZOT_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=${{ env.ZOT_IMAGE }}
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "### Image pushed to Zot"
            echo ''
            echo '```'
            echo "${{ env.ZOT_IMAGE }}:merged-deploy"
            echo "${{ env.ZOT_IMAGE }}:sha-${{ github.sha }}"
            echo '```'
            echo ''
            echo "Pin \`sha-${{ github.sha }}\` in immich/helm/values.yaml to deploy this build."
          } >> "$GITHUB_STEP_SUMMARY"
